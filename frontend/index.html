<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussão de casais onlines - Login e Cadastro</title>
    <link rel="stylesheet" href="./style/styles.css">
</head>
<body>

    <div class="container">
        <h1>Discussão de casais onlines 🗳️</h1>
        <p>Sistema de Votação Anônima para Brigas de Casal</p>

        <div id="login-box" class="form-box active">
            <h2>Login</h2>
            <form>
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn primary">Entrar</button>
            </form>
            <p class="switch-text">Não tem conta? <a href="#" id="show-register">Cadastre-se</a></p>
        </div>

        <div id="register-box" class="form-box">
            <h2>Cadastro</h2>
            <form>
                <div class="input-group">
                    <label for="register-username">Nome de Usuário</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="input-group">
                    <label for="register-email">E-mail</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="input-group">
                    <label for="register-password">Senha</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit" class="btn primary">Registrar</button>
            </form>
            <p class="switch-text">Já tem conta? <a href="#" id="show-login">Fazer Login</a></p>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
