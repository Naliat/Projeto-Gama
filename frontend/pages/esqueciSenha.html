<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Briga de casal - Esqueci Minha Senha</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <div class="container small-container">
        <h1>Sistema de Briga de casal 🗳️</h1>
        <p>Insira seu e-mail para receber um link de recuperação.</p>

        <div id="forgot-password-box" class="form-box active">
            <h2>Recuperar Senha</h2>
            <form>
                <div class="input-group">
                    <label for="recovery-email">E-mail</label>
                    <input type="email" id="recovery-email" required>
                </div>
                <button type="submit" class="btn primary">Enviar Link de Recuperação</button>
            </form>
            <p class="switch-text">
                <a href="../index.html">← Voltar para o Login</a>
            </p>
        </div>
    </div>
</body>
</html>
