<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style/perfil.css">

    <div class="container small-container">

            <div class="profile-details">

                    <label>E-mail:</label>
                    <p>usuario.anonimo@email.com</p>
                </div>
                <div class="detail-group">
                    <label>ID de Usuário:</label>
                    <p>USR99876</p>
                </div>
                <div class="detail-group">
                    <label>Membro Desde:</label>
                    <p>10/Out/2025</p>
                </div>
                <div class="detail-group">
                    <label>Discussões Postadas:</label>
                    <p>15</p>
                </div>
            </div>

            <div class="profile-actions">
                <a href="./trocarSenha.html" class="btn secondary">Trocar Senha</a>
                <a href="./listaDiscussao.html?user=self" class="btn primary">Minhas Discussões</a>
                <a href="../index.html" class="btn tertiary">Sair (Logout)</a>
            </div>
            
            <p class="back-link">
                <a href="./listaDiscussao.html">← Voltar ao Feed</a>

        </div>
    </div>

</html>
